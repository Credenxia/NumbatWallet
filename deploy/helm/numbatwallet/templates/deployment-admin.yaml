apiVersion: apps/v1
kind: Deployment
metadata:
  name: numbatwallet-admin
  labels:
    app: numbatwallet-admin
    component: frontend
    app.kubernetes.io/part-of: numbatwallet
spec:
  replicas: {{ .Values.admin.replicas }}
  selector:
    matchLabels:
      app: numbatwallet-admin
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: numbatwallet-admin
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: numbatwallet-admin
          image: "{{ .Values.image.registry }}/{{ .Values.image.admin }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ASPNETCORE_ENVIRONMENT
              {{- if .Values.admin.credentry.enabled }}
              # Credentry SSO requires a non-Development environment so "Sign in with Credentry"
              # is the SOLE interactive login (Web.Admin auth mode 2). Forced here so enabling
              # Credentry and the environment can never desync into the Azure-AD branch.
              value: "Staging"
              {{- else }}
              value: {{ .Values.admin.environment | quote }}
              {{- end }}
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"

            # API base URL — internal K8s service DNS, read by the Aspire service
            # discovery config keys (services:webapi:http:0) in Web.Admin Program.cs.
            - name: services__webapi__http__0
              value: "http://numbatwallet-api"

            # Service-to-service API key for the typed Admin GraphQL client
            - name: AdminApi__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: admin-api-key
            - name: AdminApi__TenantId
              value: {{ .Values.admin.tenantId | quote }}

            {{- if .Values.admin.credentry.enabled }}
            # "Sign in with Credentry" (auth-code + PKCE, client numbatwallet-admin). The client
            # secret comes from the K8s secret (sourced from Key Vault); never templated inline.
            - name: Credentry__Enabled
              value: "true"
            - name: Credentry__Authority
              value: {{ .Values.admin.credentry.authority | quote }}
            - name: Credentry__RequireHttpsMetadata
              value: {{ .Values.admin.credentry.requireHttpsMetadata | quote }}
            - name: Credentry__ClientId
              value: {{ .Values.admin.credentry.clientId | quote }}
            - name: Credentry__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: credentry-admin-client-secret
            {{- range $i, $scope := .Values.admin.credentry.scopes }}
            - name: Credentry__Scopes__{{ $i }}
              value: {{ $scope | quote }}
            {{- end }}
            {{- range $credentryTenant, $numbatTenant := .Values.admin.credentry.tenantMap }}
            - name: Credentry__TenantMap__{{ $credentryTenant }}
              value: {{ $numbatTenant | quote }}
            {{- end }}
            {{- end }}

          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
          # NOTE: /health on the Admin portal answers 302 → /login (auth fallback
          # policy applies to all endpoints). Kubernetes httpGet probes treat any
          # status < 400 as success, so this still proves liveness/readiness.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
