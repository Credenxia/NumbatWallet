# NumbatWallet — Helm values for the shared nonprod AKS cluster (namespace numbatwallet-test).
# Mirrors the credentry-infrastructure product conventions:
#   - shared ACR cxausvmcontainerregistry
#   - shared NGINX ingress (class "nginx"), host tst.numbatwallet.credentry.com.au
#   - secrets provided as a pipeline-managed K8s Secret (sourced from kv-numbatwallet-test-aue)
#   - small burstable resource footprint (test stage)

image:
  registry: cxausvmcontainerregistry.azurecr.io
  api: numbatwallet-api
  admin: numbatwallet-admin
  migrations: numbatwallet-migrations
  tag: test-latest
  pullPolicy: Always

# Pipeline-managed secret (created by deploy/scripts/bootstrap-namespace.sh from Key Vault
# kv-numbatwallet-test-aue). Keys: connection-string, jwt-secret-key, field-encryption-key,
# admin-api-key.
secretName: numbatwallet-secrets

api:
  replicas: 1
  # Testing: enables the seeded test accounts (TestPasswordValidator) and the test auth
  # handler — appropriate for the test stage only. Production deployments must use
  # "Production" (JWT bearer + real identity providers).
  environment: Testing
  resources:
    requests:
      memory: "256Mi"
      cpu: "25m"
    limits:
      memory: "512Mi"
      cpu: "300m"
  # Shared Redis (redis-master.shared-services.svc.cluster.local:6379).
  # Leave empty until the shared-services allow-from network policy includes
  # numbatwallet-test (credentry-infrastructure k8s-shared/network-policies) —
  # the API falls back to its in-memory distributed cache when unset (logged at
  # startup as "Distributed cache backend: ..."). When set, the app bounds the
  # Redis timeouts (abortConnect=false, connectTimeout 1000ms, syncTimeout 500ms)
  # unless the connection string overrides them.
  redisConnectionString: ""
  # Global rate limiter (per client IP, X-Forwarded-For aware). Test stage runs a
  # deliberately high permit limit so k6 load tests measure the APPLICATION, not the
  # limiter (the 2026-06-12 baseline showed 99.6% 429s at the code default of
  # 100/min). Production should NOT copy these values — omit to use the app
  # defaults (100 per minute, queue 10).
  rateLimiting:
    permitLimit: 100000
    window: "00:01:00"
    queueLimit: 10
  # Deployment-wide HMAC pepper for the deterministic email/phone search tokens
  # (Search:TokenPepper, base64 >=16 bytes). REQUIRED since the searchable-PII
  # change (10e97f9): person lookup on the login path goes through
  # email_search_token, and without a configured pepper the app falls back to the
  # in-memory mock Key Vault — a RANDOM pepper per pod start, making every
  # existing row unmatchable after a restart. Set at deploy time
  # (--set api.searchTokenPepper="$(openssl rand -base64 32)"); never commit a
  # value here. Follow-up: move to KV kv-numbatwallet-test-aue secret
  # 'search-token-pepper' sourced via the pipeline-managed K8s secret
  # (bootstrap-namespace.sh) once provisioned.
  searchTokenPepper: ""
  # Ad-hoc additional env vars for the API container (list of {name,value} maps),
  # for deploy-time-only configuration (e.g. an ephemeral extra ApiKey:Keys entry
  # for smoke/perf tooling). Keep empty in committed values.
  extraEnv: []
  # Credentry SSO federation — the API VALIDATES Credentry-issued RS256 access tokens
  # (additional bearer scheme; never replaces API-key / citizen auth). Committed DISABLED
  # and without secrets; turned on at deploy time once Credentry provisions the nonprod
  # clients (set CREDENTRY_ENABLED + the tenant-map repo variables, or --set directly).
  # The API needs no client secret — it only validates tokens. Contract:
  # credentry/docs/integration/06-NUMBATWALLET-FEDERATION-CONTRACT.md.
  credentry:
    enabled: false
    authority: "https://tst.portal.credentry.com.au"
    audience: "numbatwallet-api"
    requiredProduct: "NUMBATWALLET"
    requireHttpsMetadata: true
    # Credentry tenant GUID -> NumbatWallet tenant GUID. Populated at enable time with the
    # real nonprod Credentry tenant GUID, mapping to the AKS Testing seed tenant
    # (00000000-0000-0000-0000-000000000000). Unmapped tenants fail closed.
    tenantMap: {}

admin:
  replicas: 1
  # Development: the Admin portal's cookie/login UI only exists in Development;
  # outside Development it requires an Azure AD (Entra) app registration which the
  # test stage does not have yet. Swap to "Production" + AzureAd__* config once the
  # Entra app exists.
  environment: Development
  resources:
    requests:
      memory: "192Mi"
      cpu: "15m"
    limits:
      memory: "384Mi"
      cpu: "200m"
  # Ambient tenant used at seed time when no HTTP context exists (Guid.Empty
  # fail-closed value) — the Admin portal must address the same tenant.
  tenantId: "00000000-0000-0000-0000-000000000000"
  # Credentry SSO ("Sign in with Credentry", auth-code + PKCE, client numbatwallet-admin).
  # When enabled the deployment template forces a non-Development ASPNETCORE_ENVIRONMENT so
  # Credentry becomes the SOLE interactive login (Web.Admin auth mode 2) — enabling the flag
  # and the environment can never desync. The client secret is delivered via the K8s secret
  # key 'credentry-admin-client-secret' (bootstrap-namespace.sh ← Key Vault), never here.
  # Committed DISABLED; turn on together with api.credentry at enable time.
  credentry:
    enabled: false
    authority: "https://tst.portal.credentry.com.au"
    requireHttpsMetadata: true
    clientId: "numbatwallet-admin"
    scopes:
      - openid
      - profile
      - email
      - offline_access
      - credentry.api
      - credentry.roles
      - numbatwallet.api
    # Credentry tenant GUID -> NumbatWallet tenant GUID (same mapping as api.credentry).
    tenantMap: {}

migrations:
  # Helm pre-install/pre-upgrade hook Job (EF Core migrations bundle)
  resources:
    requests:
      memory: "128Mi"
      cpu: "25m"
    limits:
      memory: "256Mi"
      cpu: "500m"

ingress:
  className: nginx
  host: tst.numbatwallet.credentry.com.au
