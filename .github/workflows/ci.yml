name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Unit Tests
    # Gate: the five backend unit suites must pass (0 failures). Integration tests
    # (TestContainers/Docker) and warning/coverage tolerances are intentionally NOT
    # enforced here — they are tracked separately and documented as honest deltas
    # (transitive-only CVE warnings; integration suite run on demand).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore NumbatWallet.sln

      - name: Build (Release)
        run: dotnet build NumbatWallet.sln --configuration Release --no-restore

      - name: Test - Domain
        run: dotnet test src/Tests/NumbatWallet.Domain.Tests --configuration Release --no-build --verbosity normal

      - name: Test - SharedKernel
        run: dotnet test src/Tests/NumbatWallet.SharedKernel.Tests --configuration Release --no-build --verbosity normal

      - name: Test - Application
        run: dotnet test src/Tests/NumbatWallet.Application.Tests --configuration Release --no-build --verbosity normal

      - name: Test - Infrastructure
        run: dotnet test src/Tests/NumbatWallet.Infrastructure.Tests --configuration Release --no-build --verbosity normal

      - name: Test - Web.Api
        run: dotnet test src/Tests/NumbatWallet.Web.Api.Tests --configuration Release --no-build --verbosity normal
