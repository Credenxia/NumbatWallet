name: Deploy API to Azure Container Apps

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - '.github/workflows/deploy-api.yml'
      - 'infra/bicep/container-apps.bicep'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  DOTNET_VERSION: '9.0.x'
  AZURE_CONTAINER_REGISTRY: numbatwallet
  IMAGE_NAME: numbatwallet-api
  DOCKERFILE_PATH: ./src/NumbatWallet.Web.Api/Dockerfile

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run tests
      run: |
        dotnet test --no-build --configuration Release \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: TestResults

    - name: Generate Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

  build-container:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ env.AZURE_CONTAINER_REGISTRY }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ env.DOCKERFILE_PATH }}
        push: true
        tags: ${{ needs.build-and-test.outputs.image-tag }}
        cache-from: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.AZURE_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-dev:
    needs: build-container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: development
      url: ${{ steps.deploy.outputs.app-url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Bicep template
      id: deploy
      run: |
        OUTPUT=$(az deployment group create \
          --resource-group rg-numbatwallet-dev \
          --template-file ./infra/bicep/container-apps.bicep \
          --parameters \
            environment=dev \
            containerImage=${{ needs.build-and-test.outputs.image-tag }} \
            postgresConnectionString="${{ secrets.DEV_POSTGRES_CONNECTION }}" \
            keyVaultUri="${{ secrets.DEV_KEYVAULT_URI }}" \
            appInsightsConnectionString="${{ secrets.DEV_APPINSIGHTS_CONNECTION }}" \
            minReplicas=1 \
            maxReplicas=3 \
          --query "properties.outputs" -o json)

        APP_URL=$(echo $OUTPUT | jq -r '.containerAppUrl.value')
        echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
        echo "Deployed to: $APP_URL"

    - name: Run smoke tests
      run: |
        sleep 30  # Wait for app to be ready
        curl -f ${{ steps.deploy.outputs.app-url }}/health || exit 1
        curl -f ${{ steps.deploy.outputs.app-url }}/ready || exit 1

  deploy-prod:
    needs: build-container
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.app-url }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy Bicep template
      id: deploy
      run: |
        OUTPUT=$(az deployment group create \
          --resource-group rg-numbatwallet-prod \
          --template-file ./infra/bicep/container-apps.bicep \
          --parameters \
            environment=prod \
            containerImage=${{ needs.build-and-test.outputs.image-tag }} \
            postgresConnectionString="${{ secrets.PROD_POSTGRES_CONNECTION }}" \
            keyVaultUri="${{ secrets.PROD_KEYVAULT_URI }}" \
            appInsightsConnectionString="${{ secrets.PROD_APPINSIGHTS_CONNECTION }}" \
            minReplicas=2 \
            maxReplicas=10 \
          --query "properties.outputs" -o json)

        APP_URL=$(echo $OUTPUT | jq -r '.containerAppUrl.value')
        echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
        echo "Deployed to: $APP_URL"

    - name: Run smoke tests
      run: |
        sleep 30  # Wait for app to be ready
        curl -f ${{ steps.deploy.outputs.app-url }}/health || exit 1
        curl -f ${{ steps.deploy.outputs.app-url }}/ready || exit 1

    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment:** Production" >> $GITHUB_STEP_SUMMARY
        echo "- **URL:** ${{ steps.deploy.outputs.app-url }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Image:** ${{ needs.build-and-test.outputs.image-tag }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Time:** $(date)" >> $GITHUB_STEP_SUMMARY